<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry Point Reports</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --surface-2: #f0f2f5; --border: #e3e6ea;
    --text: #1c1e21; --muted: #65676b; --accent: #1877f2;
    --pass: #1f9d55; --pass-bg: #e6f6ec; --fail: #d93025; --fail-bg: #fdecea; --skip: #8a8d91; --skip-bg: #eef0f2;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --surface: #1b1d20; --surface-2: #24272b; --border: #2e3237;
      --text: #e4e6eb; --muted: #a0a4ab; --accent: #4c9bff;
      --pass: #4ccf7f; --pass-bg: #163524; --fail: #ff6b5e; --fail-bg: #3d1a17; --skip: #9ba0a7; --skip-bg: #2a2d31;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315; --surface: #1b1d20; --surface-2: #24272b; --border: #2e3237;
    --text: #e4e6eb; --muted: #a0a4ab; --accent: #4c9bff;
    --pass: #4ccf7f; --pass-bg: #163524; --fail: #ff6b5e; --fail-bg: #3d1a17; --skip: #9ba0a7; --skip-bg: #2a2d31;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile.pass .value { color: var(--pass); } .tile.fail .value { color: var(--fail); }
  .history { padding: 14px 16px; margin-bottom: 16px; }
  .history .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .bars { display: flex; gap: 3px; height: 44px; overflow-x: auto; }
  .bar { flex: 0 0 14px; height: 100%; border-radius: 3px; background: var(--fail); opacity: .75; }
  .bar.ok { background: var(--pass); }
  .bar:hover, .bar:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  a { color: var(--accent); }
  .back { font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 8px; }
  .rate { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rate.ok { color: var(--pass); } .rate.bad { color: var(--fail); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.main:hover { background: var(--surface-2); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .status.passed { color: var(--pass); background: var(--pass-bg); }
  .status.failed, .status.timedOut, .status.interrupted { color: var(--fail); background: var(--fail-bg); }
  .status.skipped { color: var(--skip); background: var(--skip-bg); }
  .kind { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .name { font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .mismatch { color: var(--fail); font-weight: 600; }
  .muted { color: var(--muted); }
  .thumb { width: 96px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  .err { background: var(--fail-bg); color: var(--text); white-space: pre-wrap; font-size: 12px; padding: 10px 12px; border-radius: 8px; margin: 0; max-height: 240px; overflow: auto; }
  .detail td { background: var(--surface-2); }
  .detail a { color: var(--accent); }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog img, dialog video { max-width: 95vw; max-height: 90vh; border-radius: 8px; display: block; background: #000; }
  dialog .empty { background: var(--surface); border-radius: 8px; }
  .proof { display: flex; align-items: center; gap: 8px; }
  .chip.play { white-space: nowrap; }
  .evidence { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .evidence figure { margin: 0; }
  .evidence figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .thumb.big { width: 240px; height: 150px; }
  .evidence video { width: 320px; max-width: 100%; border-radius: 6px; background: #000; display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) { .hide-sm { display: none; } .thumb { width: 64px; height: 40px; } }
  /* Report có nhiều cột: giữ độ rộng tối thiểu, màn hẹp thì cuộn ngang trong khung bảng */
  .report table { min-width: 1080px; }
  .report td .name { display: inline-block; min-width: 180px; }
  .play-cell { font-size: 12px; white-space: nowrap; }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Entry Point Reports</h1>
      <div class="sub" id="meta"></div>
    </div>
  </header>

  <section class="tiles" id="tiles"></section>
  <section class="card history">
    <div class="label">Lịch sử (cũ → mới) · xanh = tất cả pass, đỏ = có fail · bấm để mở report</div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card table-wrap">
    <table>
      <thead><tr><th>Thời điểm chạy</th><th>Kết quả</th><th>Tỉ lệ pass</th><th class="hide-sm">Game</th><th class="hide-sm">Browser</th><th class="hide-sm">Thời gian</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<script>
// Danh sách report được reporter nhúng vào lúc build, mới nhất trước
const RUNS = [{"id":"2026-09-28T11-27-52-253Z","file":"reports/2026-09-28T11-27-52-253Z.html","startedAt":"2026-09-28T11:27:52.253Z","durationMs":186276.96,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-28T10-46-25-603Z","file":"reports/2026-09-28T10-46-25-603Z.html","startedAt":"2026-09-28T10:46:25.603Z","durationMs":204331.89800000002,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-28T09-03-54-323Z","file":"reports/2026-09-28T09-03-54-323Z.html","startedAt":"2026-09-28T09:03:54.323Z","durationMs":106362.816,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}}];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDur = (ms) => { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${(ms / 1000).toFixed(1)}s`; };
const fmtTime = (iso) => new Date(iso).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
const rateOf = (c) => (c.total - c.skipped ? Math.round((c.passed / (c.total - c.skipped)) * 100) : 0);

if (!RUNS.length) {
  $('#rows').innerHTML = '<tr><td colspan="7" class="empty">Chưa có report nào. Chạy <code>npm test</code> để tạo.</td></tr>';
} else {
  const last = RUNS[0];
  const games = [...new Set(RUNS.map((r) => r.meta.gameName || r.meta.gameId))];
  $('#meta').textContent = `${RUNS.length} report · ${games.join(', ')}`;
  $('#tiles').innerHTML = [
    [last.counts.failed ? 'fail' : 'pass', 'Lần chạy gần nhất', `${rateOf(last.counts)}%`],
    ['', 'Chạy lúc', fmtTime(last.startedAt)],
    ['', 'Số report', RUNS.length],
    ['pass', 'Toàn bộ pass', `${RUNS.filter((r) => !r.counts.failed).length}/${RUNS.length}`],
  ].map(([cls, l, v]) => `<div class="card tile ${cls}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

  $('#bars').innerHTML = [...RUNS].reverse().map((r) =>
    `<a class="bar ${r.counts.failed ? '' : 'ok'}" href="${esc(r.file)}"
      title="${fmtTime(r.startedAt)} — ${r.counts.passed}/${r.counts.total} pass"
      aria-label="${fmtTime(r.startedAt)}: ${r.counts.passed} trên ${r.counts.total} pass"></a>`).join('');

  $('#rows').innerHTML = RUNS.map((r) => {
    const rate = rateOf(r.counts);
    return `<tr class="main">
      <td><a href="${esc(r.file)}">${fmtTime(r.startedAt)}</a></td>
      <td><span class="status ${r.counts.failed ? 'failed' : 'passed'}">${r.counts.failed ? `✕ ${r.counts.failed} fail` : '✓ Pass'}</span></td>
      <td><span class="rate ${r.counts.failed ? 'bad' : 'ok'}">${rate}%</span> <span class="muted">(${r.counts.passed}/${r.counts.total})</span></td>
      <td class="hide-sm">${esc(r.meta.gameName || r.meta.gameId)}</td>
      <td class="hide-sm mono muted">${esc(r.meta.browser)}</td>
      <td class="hide-sm muted">${fmtDur(r.durationMs)}</td>
      <td><a href="${esc(r.file)}">Xem →</a></td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
