<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry Point Reports</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --surface-2: #f0f2f5; --border: #e3e6ea;
    --text: #1c1e21; --muted: #65676b; --accent: #1877f2;
    --pass: #1f9d55; --pass-bg: #e6f6ec; --warn: #a15c00; --warn-bg: #fff4d6; --fail: #d93025; --fail-bg: #fdecea; --skip: #8a8d91; --skip-bg: #eef0f2;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --surface: #1b1d20; --surface-2: #24272b; --border: #2e3237;
      --text: #e4e6eb; --muted: #a0a4ab; --accent: #4c9bff;
      --pass: #4ccf7f; --pass-bg: #163524; --warn: #f2b84b; --warn-bg: #3a2c10; --fail: #ff6b5e; --fail-bg: #3d1a17; --skip: #9ba0a7; --skip-bg: #2a2d31;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315; --surface: #1b1d20; --surface-2: #24272b; --border: #2e3237;
    --text: #e4e6eb; --muted: #a0a4ab; --accent: #4c9bff;
    --pass: #4ccf7f; --pass-bg: #163524; --warn: #f2b84b; --warn-bg: #3a2c10; --fail: #ff6b5e; --fail-bg: #3d1a17; --skip: #9ba0a7; --skip-bg: #2a2d31;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile.pass .value { color: var(--pass); } .tile.fail .value { color: var(--fail); }
  .history { padding: 14px 16px; margin-bottom: 16px; }
  .history .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .bars { display: flex; gap: 3px; height: 44px; overflow-x: auto; }
  .bar { flex: 0 0 14px; height: 100%; border-radius: 3px; background: var(--fail); opacity: .75; }
  .bar.ok { background: var(--pass); }
  .bar:hover, .bar:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
  a { color: var(--accent); }
  .back { font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 8px; }
  .rate { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rate.ok { color: var(--pass); } .rate.bad { color: var(--fail); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.main:hover { background: var(--surface-2); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .status.passed { color: var(--pass); background: var(--pass-bg); }
  .status.failed, .status.timedOut, .status.interrupted { color: var(--fail); background: var(--fail-bg); }
  .status.skipped { color: var(--skip); background: var(--skip-bg); }
  .kind { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .name { font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .mismatch { color: var(--fail); font-weight: 600; }
  .muted { color: var(--muted); }
  .thumb { width: 96px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  .err { background: var(--fail-bg); color: var(--text); white-space: pre-wrap; font-size: 12px; padding: 10px 12px; border-radius: 8px; margin: 0; max-height: 240px; overflow: auto; }
  .detail td { background: var(--surface-2); }
  .detail a { color: var(--accent); }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog img, dialog video { max-width: 95vw; max-height: 90vh; border-radius: 8px; display: block; background: #000; }
  dialog .empty { background: var(--surface); border-radius: 8px; }
  .proof { display: flex; align-items: center; gap: 8px; }
  .chip.play { white-space: nowrap; }
  .evidence { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .evidence figure { margin: 0; }
  .evidence figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .thumb.big { width: 240px; height: 150px; }
  .evidence video { width: 320px; max-width: 100%; border-radius: 6px; background: #000; display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) { .hide-sm { display: none; } .thumb { width: 64px; height: 40px; } }
  /* Report có nhiều cột: giữ độ rộng tối thiểu, màn hẹp thì cuộn ngang trong khung bảng */
  /* Bảng report: luôn vừa khung, không cuộn ngang — chữ dài tự xuống dòng */
  .table-wrap.report { overflow: visible; }
  .report td.mono, .report .play-cell .mono { overflow-wrap: break-word; }
  .report td .name { font-weight: 500; }
  .report th, .report td { padding: 10px; }
  .play-cell { font-size: 12px; }
  .report .proof { flex-wrap: wrap; }
  /* Màn hẹp: mỗi dòng thành 1 thẻ xếp dọc, nhãn cột hiện bên trái */
  @media (max-width: 900px) {
    .report table, .report tbody, .report tr, .report td { display: block; width: 100%; }
    .report thead { display: none; }
    .report tr.main { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .report tr.main td { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; border: 0; padding: 4px 0; }
    .report tr.main td::before { content: attr(data-label); color: var(--muted); font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .report tr.detail td { padding: 10px 12px; }
    .evidence figure, .thumb.big, .evidence video { width: 100%; }
  }
  /* Report chia theo feature */
  .feature { margin-top: 28px; }
  .feature h2 { font-size: 18px; margin: 0 0 10px; }
  .feature h2 .muted { font-size: 14px; font-weight: 400; }
  .feature > .sub { margin: -4px 0 12px; }
  #featureNav:empty { display: none; }
  #featureNav .chip { text-decoration: none; }
  /* Lưới thiết bị (responsive) */
  .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .device { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .device-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .device-head h3 { margin: 0; font-size: 15px; }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .shots figure { margin: 0; }
  .shots figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center; }
  .frame { background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); max-height: 360px; display: flex; justify-content: center; }
  .thumb.shot { width: 100%; height: 100%; object-fit: contain; border: 0; border-radius: 0; }
  .spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  .spec dt { color: var(--muted); }
  .spec dd { margin: 0; }
  .checks { list-style: none; padding: 0; margin: 0; font-size: 13px; display: grid; gap: 4px; }
  .checks li.ok span { color: var(--pass); font-weight: 700; }
  .checks li.bad { color: var(--fail); }
  .checks li.bad span { font-weight: 700; }
  .device details { font-size: 12px; }
  .device details summary { cursor: pointer; color: var(--muted); }
  .ua .mono { word-break: break-all; margin-top: 4px; }
  /* Cảnh báo: sai lệch trong ngưỡng cho phép */
  .status.warned { color: var(--warn); background: var(--warn-bg); }
  .tile.warn .value { color: var(--warn); }
  .checks li.warn { color: var(--warn); }
  .checks li.warn span { font-weight: 700; }
  .checks .check-detail { color: var(--text); background: var(--warn-bg); border-radius: 6px; padding: 6px 8px; margin-top: 4px; font-size: 12px; line-height: 1.5; }
  .checks li.bad .check-detail { background: var(--fail-bg); }
  .device.has-warn { border-color: var(--warn); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Chọn game trên landing page */
  .game-picker { margin-bottom: 16px; }
  .game-chip { display: inline-flex; align-items: center; gap: 6px; }
  .game-chip[aria-pressed="true"] .muted { color: rgba(255,255,255,.8); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); display: inline-block; }
  .dot.failed { background: var(--fail); } .dot.warned { background: var(--warn); }
  .bar.warn { background: var(--warn); }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Test Reports</h1>
      <div class="sub" id="meta"></div>
    </div>
  </header>

  <nav class="toolbar game-picker" id="gamePicker" aria-label="Chọn game"></nav>

  <section class="tiles" id="tiles"></section>
  <section class="card history">
    <div class="label">Lịch sử (cũ → mới) · xanh = tất cả pass, vàng = có cảnh báo, đỏ = có fail · bấm để mở report</div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card table-wrap">
    <table>
      <thead><tr><th>Thời điểm chạy</th><th>Kết quả</th><th>Tỉ lệ pass</th><th class="hide-sm">Game</th><th class="hide-sm">Feature</th><th class="hide-sm">Browser</th><th class="hide-sm">Thời gian</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<script>
// Reporter nhúng vào lúc build: danh sách lần chạy (mới nhất trước) + danh sách game đang cấu hình
const DATA = {"runs":[{"id":"2026-09-29T05-00-58-554Z","file":"reports/2026-09-29T05-00-58-554Z.html","startedAt":"2026-09-29T05:00:58.554Z","durationMs":352144.458,"status":"passed","counts":{"total":25,"passed":25,"failed":0,"skipped":0,"warned":3},"features":["auth","entry-point","responsive"],"games":[{"slug":"snake-escape","id":"1329094249218455","name":"Snake Escape Puzzle","account":"mk***@tfbnw.net"}],"meta":{"browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-29T04-42-47-461Z","file":"reports/2026-09-29T04-42-47-461Z.html","startedAt":"2026-09-29T04:42:47.461Z","durationMs":335589.555,"status":"passed","counts":{"total":25,"passed":25,"failed":0,"skipped":0},"features":["auth","entry-point","responsive"],"games":[{"slug":"snake-escape","id":"1329094249218455","name":"Snake Escape Puzzle","account":"mk***@tfbnw.net"}],"meta":{"browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-29T04-29-08-336Z","file":"reports/2026-09-29T04-29-08-336Z.html","startedAt":"2026-09-29T04:29:08.336Z","durationMs":335608.162,"status":"passed","counts":{"total":25,"passed":25,"failed":0,"skipped":0},"features":["auth","entry-point","responsive"],"games":[{"slug":"snake-escape","id":"1329094249218455","name":"Snake Escape Puzzle","account":"mk***@tfbnw.net"}],"meta":{"browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-29T04-27-17-029Z","file":"reports/2026-09-29T04-27-17-029Z.html","startedAt":"2026-09-29T04:27:17.029Z","durationMs":102627.336,"status":"passed","counts":{"total":8,"passed":8,"failed":0,"skipped":0},"features":["responsive"],"games":[{"slug":"snake-escape","id":"1329094249218455","name":"Snake Escape Puzzle","account":"mk***@tfbnw.net"}],"meta":{"browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-28T11-27-52-253Z","file":"reports/2026-09-28T11-27-52-253Z.html","startedAt":"2026-09-28T11:27:52.253Z","durationMs":186276.96,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-28T10-46-25-603Z","file":"reports/2026-09-28T10-46-25-603Z.html","startedAt":"2026-09-28T10:46:25.603Z","durationMs":204331.89800000002,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}},{"id":"2026-09-28T09-03-54-323Z","file":"reports/2026-09-28T09-03-54-323Z.html","startedAt":"2026-09-28T09:03:54.323Z","durationMs":106362.816,"status":"passed","counts":{"total":17,"passed":17,"failed":0,"skipped":0},"meta":{"gameId":"1329094249218455","gameName":"Snake Escape Puzzle","account":"mk***@tfbnw.net","browser":"msedge","playwright":"1.63.0"}}],"games":[{"slug":"goods-tidy","id":"2148819552196072","name":"Goods Tidy Puzzle"},{"slug":"snake-escape","id":"1329094249218455","name":"Snake Escape Puzzle"}]};
const RUNS = DATA?.runs ?? [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDur = (ms) => { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${(ms / 1000).toFixed(1)}s`; };
const fmtTime = (iso) => new Date(iso).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
const rateOf = (c) => (c.total - c.skipped ? Math.round((c.passed / (c.total - c.skipped)) * 100) : 0);
const FEATURE_LABEL = { auth: 'Đăng nhập', 'entry-point': 'Entry point', responsive: 'Responsive' };
const featuresOf = (r) => (r.features ?? ['auth', 'entry-point']).map((f) => FEATURE_LABEL[f] ?? f);

// Danh sách game: game đang cấu hình + game xuất hiện trong lịch sử (kể cả game đã gỡ khỏi cấu hình)
const GAMES = new Map((DATA?.games ?? []).map((g) => [g.slug, g]));
const byName = new Map([...GAMES.values()].map((g) => [g.name, g.slug]));
/** Game của 1 lần chạy. Report cũ (trước khi hỗ trợ nhiều game) chỉ có meta.gameName */
const gamesOf = (r) => r.games ?? [{ slug: byName.get(r.meta.gameName) ?? r.meta.gameId, id: r.meta.gameId, name: r.meta.gameName, account: r.meta.account }];
for (const r of RUNS) for (const g of gamesOf(r)) if (!GAMES.has(g.slug)) GAMES.set(g.slug, g);

/** Số liệu của 1 game trong 1 lần chạy (null nếu lần chạy đó không có game này) */
function countsOf(r, slug) {
  if (!slug) return r.counts;
  if (r.perGame) return r.perGame[slug] ?? null;
  const gs = gamesOf(r);
  return gs.length === 1 && gs[0].slug === slug ? r.counts : null;
}
const statusOf = (c) => (c.failed ? 'failed' : c.warned ? 'warned' : 'passed');
const statusText = (c) => (c.failed ? `✕ ${c.failed} fail` : c.warned ? `⚠ Pass · ${c.warned} cảnh báo` : '✓ Pass');

// Game đang chọn: giữ trên URL (#game=<slug>) để gửi link, nhớ lựa chọn gần nhất trong trình duyệt
function initialGame() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('game');
  if (fromHash !== null) return GAMES.has(fromHash) ? fromHash : '';
  try { const saved = localStorage.getItem('game'); if (saved && GAMES.has(saved)) return saved; } catch {}
  return '';
}
let selected = initialGame();

function select(slug) {
  selected = slug;
  history.replaceState(null, '', slug ? `#game=${encodeURIComponent(slug)}` : location.pathname);
  try { localStorage.setItem('game', slug); } catch {}
  render();
}

function renderPicker() {
  const chip = (slug, label, runs) => {
    const last = runs[0] && countsOf(runs[0], slug);
    return `<button class="chip game-chip" data-game="${esc(slug)}" aria-pressed="${slug === selected}">
      ${last ? `<span class="dot ${statusOf(last)}" aria-hidden="true"></span>` : ''}${esc(label)}
      <span class="muted">${runs.length}</span></button>`;
  };
  $('#gamePicker').innerHTML = GAMES.size > 1 || !RUNS.length ? [
    chip('', 'Tất cả game', RUNS),
    ...[...GAMES.values()].map((g) => chip(g.slug, g.name, RUNS.filter((r) => countsOf(r, g.slug)))),
  ].join('') : '';
}

function render() {
  renderPicker();
  const game = selected ? GAMES.get(selected) : null;
  const runs = RUNS.filter((r) => countsOf(r, selected));
  const colspan = 8;
  $('#title').textContent = game ? `${game.name} · Test Reports` : 'Test Reports';
  document.title = $('#title').textContent;

  if (!runs.length) {
    $('#meta').textContent = game ? `App ID ${game.id}` : '';
    $('#tiles').innerHTML = '';
    $('#bars').innerHTML = '';
    $('#rows').innerHTML = `<tr><td colspan="${colspan}" class="empty">${game
      ? `Chưa có lần chạy nào cho ${esc(game.name)}. Chạy <code>npx playwright test --project=${esc(game.slug)}</code> để tạo.`
      : 'Chưa có report nào. Chạy <code>npm test</code> để tạo.'}</td></tr>`;
    return;
  }

  const account = game && gamesOf(runs[0]).find((g) => g.slug === game.slug)?.account;
  $('#meta').innerHTML = game
    ? `App ID <code>${esc(game.id)}</code>${account ? ` · Account <code>${esc(account)}</code>` : ''} · ${runs.length} lần chạy`
    : `${runs.length} lần chạy · ${GAMES.size} game`;

  const last = countsOf(runs[0], selected);
  $('#tiles').innerHTML = [
    [last.failed ? 'fail' : last.warned ? 'warn' : 'pass', 'Lần chạy gần nhất', `${rateOf(last)}%`],
    ['', 'Chạy lúc', fmtTime(runs[0].startedAt)],
    ['', 'Số lần chạy', runs.length],
    ['pass', 'Toàn bộ pass', `${runs.filter((r) => !countsOf(r, selected).failed).length}/${runs.length}`],
  ].map(([cls, l, v]) => `<div class="card tile ${cls}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

  // Link sang report kèm game đang chọn để report lọc sẵn
  const link = (r) => `${esc(r.file)}${selected ? `#game=${encodeURIComponent(selected)}` : ''}`;
  $('#bars').innerHTML = [...runs].reverse().map((r) => {
    const c = countsOf(r, selected);
    return `<a class="bar ${c.failed ? '' : c.warned ? 'warn' : 'ok'}" href="${link(r)}"
      title="${fmtTime(r.startedAt)} — ${c.passed}/${c.total} pass${c.warned ? `, ${c.warned} cảnh báo` : ''}"
      aria-label="${fmtTime(r.startedAt)}: ${c.passed} trên ${c.total} pass"></a>`;
  }).join('');

  $('#rows').innerHTML = runs.map((r) => {
    const c = countsOf(r, selected);
    return `<tr class="main">
      <td><a href="${link(r)}">${fmtTime(r.startedAt)}</a></td>
      <td><span class="status ${statusOf(c)}">${statusText(c)}</span></td>
      <td><span class="rate ${c.failed ? 'bad' : 'ok'}">${rateOf(c)}%</span> <span class="muted">(${c.passed}/${c.total})</span></td>
      <td class="hide-sm">${esc(gamesOf(r).map((g) => g.name).join(', '))}</td>
      <td class="hide-sm">${featuresOf(r).map((f) => `<span class="kind">${esc(f)}</span>`).join(' ')}</td>
      <td class="hide-sm mono muted">${esc(r.meta.browser)}</td>
      <td class="hide-sm muted">${fmtDur(r.durationMs)}</td>
      <td><a href="${link(r)}">Xem →</a></td>
    </tr>`;
  }).join('');
}

$('#gamePicker').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-game]');
